name: Remove obsolete Alpha35 release
on:
  push:
    paths: ['.github/workflows/prune-alpha35-release.yml']
permissions:
  contents: write
jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete verified obsolete Alpha35 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id='391281248'
          expected='v2.1.0-alpha.35'
          actual="$(gh api "repos/$GITHUB_REPOSITORY/releases/$id" --jq .tag_name)"
          if [ "$actual" != "$expected" ]; then
            echo "Safety check failed: expected $expected, got $actual"
            exit 1
          fi
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          echo "Deleted $actual ($id)"
