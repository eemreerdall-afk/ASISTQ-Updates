name: Prune obsolete installer releases
on:
  push:
    branches: [main]
    paths: ['.github/workflows/prune-old-releases.yml']
permissions:
  contents: write
jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete exactly 43 obsolete releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          targets=(
            392766610:v2.1.0-alpha.48
            392757601:v2.1.0-alpha.47
            392744618:v2.1.0-alpha.46
            391999635:v2.1.0-alpha.45
            391981650:v2.1.0-alpha.44
            391967417:v2.1.0-alpha.43
            391481692:v2.1.0-alpha.42
            391448647:v2.1.0-alpha.41
            391416031:v2.1.0-alpha.40
            391371030:v2.1.0-alpha.39
            391353467:v2.1.0-alpha.38
            391341434:v2.1.0-alpha.37
            391334703:v2.1.0-alpha.36
            390711860:v2.1.0-alpha.34
            389970817:v2.1.0-alpha.32
            389964751:v2.1.0-alpha.31
            389958807:v2.1.0-alpha.30
            389925301:v2.1.0-alpha.29
            389914142:v2.1.0-alpha.28
            389906089:v2.1.0-alpha.27
            389900113:v2.1.0-alpha.26
            389892644:v2.1.0-alpha.25
            389861096:v2.1.0-alpha.24
            389855751:v2.1.0-alpha.23
            389850487:v2.1.0-alpha.22
            389819289:v2.1.0-alpha.21
            389813638:v2.1.0-alpha.20
            389794187:v2.1.0-alpha.19
            389768055:v2.1.0-alpha.18
            389736667:v2.1.0-alpha.17
            389730599:v2.1.0-alpha.16
            389725068:v2.1.0-alpha.15
            389710353:v2.1.0-alpha.14
            389698835:v2.1.0-alpha.13
            389689521:v2.1.0-alpha.12
            389504394:v2.1.0-alpha.9
            389500396:v2.1.0-alpha.8
            389497262:v2.1.0-alpha.7
            389493970:v2.1.0-alpha.6
            389487272:v2.1.0-alpha.5
            389304519:v2.1.0-alpha.4
            389654602:v2.1.0-alpha.11
            389508833:v2.1.0-alpha.10
          )
          if [ "${#targets[@]}" -ne 43 ]; then
            echo "Safety check failed: expected 43 targets"
            exit 1
          fi
          for item in "${targets[@]}"; do
            id="${item%%:*}"
            expected="${item#*:}"
            actual="$(gh api "repos/$GITHUB_REPOSITORY/releases/$id" --jq .tag_name)"
            if [ "$actual" != "$expected" ]; then
              echo "Safety check failed for release $id: expected $expected, got $actual"
              exit 1
            fi
            if [ "$actual" = "v2.1.0-alpha.35" ] || [ "$actual" = "v2.1.0-alpha.49" ]; then
              echo "Protected release encountered: $actual"
              exit 1
            fi
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            echo "Deleted $actual ($id)"
          done
